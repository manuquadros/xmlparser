[project]
name = "xmlparser"
dynamic = ["version"]
description = "D3 utilities for parsing XML files"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11, <4"
dependencies = ["lxml>=5.4.0", "nltk>=3.10.3"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = "src"


[tool.pdm.version]
source = "scm"

[tool.pdm.scripts]
changelog = "git-cliff --output CHANGELOG.md"
next-version = "git-cliff --bumped-version"
release = "python scripts/release.py"
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-profiling>=1.8.1",
    "git-cliff>=2.13.1",
]

